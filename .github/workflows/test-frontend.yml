name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
  pull_request:
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.3.0
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.2.0
    - name: Use Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage
    - name: Upload Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/frontend/coverage/coverage-final.json

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest

    env:
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      NODE_OPTIONS: --max_old_space_size=4096

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]

    services:
      postgres:
        image: postgres:15
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@v4.3.0
      with:
        submodules: true
    # https://github.com/cypress-io/cypress-docker-images/issues/150
    #- name: Install mplayer for FireFox
    #  run: sudo apt install mplayer -y
    #  if: ${{ matrix.browser == 'firefox' }}
    #- uses: browser-actions/setup-firefox@latest
    #  if: ${{ matrix.browser == 'firefox' }}
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.2.0
    - name: Use Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - name: Install Cypress system dependencies
      run: |
        set -euxo pipefail
        sudo apt-get update
        GTK3_PKG=$(if apt-cache show libgtk-3-0 >/dev/null 2>&1; then echo libgtk-3-0; else echo libgtk-3-0t64; fi)
        ATK_BRIDGE_PKG=$(if apt-cache show libatk-bridge2.0-0 >/dev/null 2>&1; then echo libatk-bridge2.0-0; else echo libatk-bridge2.0-0t64; fi)
        ATK_PKG=$(if apt-cache show libatk1.0-0 >/dev/null 2>&1; then echo libatk1.0-0; else echo libatk1.0-0t64; fi)
        ATSPI_PKG=$(if apt-cache show libatspi2.0-0 >/dev/null 2>&1; then echo libatspi2.0-0; else echo libatspi2.0-0t64; fi)
        ALSA_PKG=$(if apt-cache show libasound2 >/dev/null 2>&1; then echo libasound2; else echo libasound2t64; fi)
        sudo apt-get install --no-install-recommends -y \
          "$GTK3_PKG" \
          "$ATK_BRIDGE_PKG" \
          "$ATK_PKG" \
          "$ATSPI_PKG" \
          "$ALSA_PKG" \
          libnss3 \
          libxss1 \
          libx11-xcb1 \
          libxrandr2 \
          libxi6 \
          libxdamage1 \
          libxcomposite1 \
          libxcursor1 \
          libxinerama1 \
          libgbm-dev \
          libdrm2 \
          libxkbcommon0 \
          libpangocairo-1.0-0 \
          libpango-1.0-0 \
          libglu1-mesa \
          libxshmfence1 \
          xvfb
        sudo rm -rf /var/lib/apt/lists/*
    - name: Cache Cypress binary
      uses: actions/cache@v4
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-cypress-
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    # https://github.com/cypress-io/cypress/issues/4351#issuecomment-559489091
    - name: ALSA Env
      run: echo -e 'pcm.!default {\n type hw\n card 0\n}\n\nctl.!default {\n type hw\n card 0\n}' > ~/.asoundrc
    # XXX: This tries reinstalling Cypress if the binary is not cached
    # Remove this when the cache issue is fixed
    - name: Cypress install
      run: pnpm exec cypress install
    - name: Cypress run
      uses: cypress-io/github-action@v6
      timeout-minutes: 20
      with:
        install: false
        start: pnpm start:test
        wait-on: 'http://127.0.0.1:61812/healthz'
        wait-on-timeout: 120000
        browser: ${{ matrix.browser }}
        headed: true
        xvfb: true
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ${{ matrix.browser }}-cypress-screenshots
        path: cypress/screenshots
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.browser }}-cypress-videos
        path: cypress/videos
